{{- $config := include "meshcentral.config" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meshcentral.fullname" . }}-config
  labels:
    {{- include "meshcentral.labels" . | nindent 4 }}
type: Opaque
data:
  config.json: {{ $config | b64enc }}
  sessionkey: {{ ($config | fromJson).settings.sessionkey | b64enc }}
